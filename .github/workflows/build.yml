name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Coop.dll (32-bit, Release)
        run: |
          cmake -S . -B build/Bin32 -G "Visual Studio 17 2022" -A Win32
          cmake --build build/Bin32 --config Release

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Crysis-Coop
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Crysis Coop $tag" --generate-notes }
          # a release published by hand keeps its (tested) archive
          if ($assets -match 'Crysis-Coop-.*\.zip') { Write-Host "release $tag already has an archive"; exit 0 }
          gh release upload $tag (Get-Item dist/*.zip).FullName Installer/install.ps1
